replicaCount: 3

image:
  repository: ghcr.io/james-finn-travers/charge-myv
  pullPolicy: IfNotPresent
  tag: "latest"

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: false
  className: "nginx"
  annotations: {}
  hosts:
    - host: chart-example.local
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls: []

env:
  RAILS_ENV: "production"
  JWT_SECRET: ""
  DATABASE_URL: ""
